<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нейрона — AI-чат</title>
<style>
:root{
  --bg:#eef1f8; --card:#ffffff; --text:#0f172a; --muted:#64748b;
  --border:#e2e8f0; --acc1:#6366f1; --acc2:#8b5cf6;
  --user-bg:linear-gradient(135deg,#6366f1,#8b5cf6);
}
html[data-theme="dark"]{
  --bg:#0b1220; --card:#111a2e; --text:#e2e8f0; --muted:#94a3b8; --border:#1e293b;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
.ac-top{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--border)}
.ac-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--acc1),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.ac-top h1{font-size:16px;margin:0}
.ac-top .sub{font-size:11px;color:var(--muted)}
.ac-top a{margin-left:auto;color:var(--acc1);text-decoration:none;font-weight:700;font-size:13px}
.ac-body{flex:1;display:flex;min-height:0}
.ac-side{width:280px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column}
.ac-new{margin:12px;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;font-weight:700;cursor:pointer;font-size:14px}
.ac-new:hover{filter:brightness(1.1)}
.ac-list{flex:1;overflow-y:auto;padding:0 8px 12px}
.ac-item{padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:4px;position:relative}
.ac-item:hover{background:rgba(99,102,241,.08)}
.ac-item.on{background:rgba(99,102,241,.14);border:1px solid rgba(99,102,241,.35)}
.ac-item .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:22px}
.ac-item .p{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-item .del{position:absolute;right:8px;top:8px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:13px;display:none}
.ac-item:hover .del{display:block}
.ac-main{flex:1;display:flex;flex-direction:column;min-width:0}
.ac-msgs{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.ac-empty{margin:auto;text-align:center;color:var(--muted)}
.ac-empty .big{font-size:44px}
.msg{max-width:76%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;box-shadow:0 4px 14px rgba(15,23,42,.08)}
.msg.user{align-self:flex-end;background:var(--user-bg);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg .file{display:block;margin-top:6px;font-size:11px;opacity:.8}
.msg .ts{display:block;margin-top:6px;font-size:10px;opacity:.55;text-align:right}
.typing{align-self:flex-start;display:flex;gap:5px;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-radius:16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--acc2);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,100%{opacity:.25}50%{opacity:1}}
.ac-input{display:flex;gap:8px;align-items:flex-end;padding:14px 18px;background:var(--card);border-top:1px solid var(--border)}
.ac-input textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:12px;padding:11px 14px;font:inherit;font-size:14px;background:var(--bg);color:var(--text);max-height:140px;outline:none}
.ac-input textarea:focus{border-color:var(--acc1)}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.ibtn:hover{border-color:var(--acc1);color:var(--acc1)}
.ibtn.send{background:linear-gradient(135deg,var(--acc1),var(--acc2));border:none;color:#fff}
.ibtn.mic.on{background:#ef4444;border-color:#ef4444;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}70%{box-shadow:0 0 0 12px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 10px;background:var(--card)}
.chip{font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:3px 10px}
@media(max-width:800px){.ac-side{display:none}}
</style>
</head>
<body>
<div class="ac-top">
  <div class="ac-logo">🤖</div>
  <div><h1>Нейрона AI-чат</h1><div class="sub">Нейрона ИИ · локальный контур Подмосковья</div></div>
  <a href="/">← Главная</a>
</div>
<div class="ac-body">
  <aside class="ac-side">
    <button class="ac-new" id="newBtn">＋ Новый чат</button>
    <div class="ac-list" id="dlgList"></div>
  </aside>
  <main class="ac-main">
    <div class="ac-msgs" id="msgs"></div>
    <div class="chips" id="chips"></div>
    <div class="ac-input">
      <input type="file" id="file" multiple hidden accept=".txt,.docx,.pdf,.csv,.md">
      <button class="ibtn" id="attachBtn" title="Прикрепить файл (txt, docx, pdf)">📎</button>
      <textarea id="inp" rows="1" placeholder="Сообщение… (Enter — отправить, Shift+Enter — перенос)"></textarea>
      <button class="ibtn mic" id="micBtn" title="Диктовка голосом">🎤</button>
      <button class="ibtn send" id="sendBtn" title="Отправить">➤</button>
    </div>
  </main>
</div>
<script>
let cur = null, busy = false;
const $ = id => document.getElementById(id);
const api = (u, o) => fetch(u, o).then(r => r.json());
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>"); }

async function loadList(){
  const r = await api("/aichat/api/dialogs");
  $("dlgList").innerHTML = (r.items||[]).map(d =>
    `<div class="ac-item ${d.id===cur?"on":""}" data-id="${d.id}">
       <div class="t">${esc(d.title)}</div><div class="p">${esc(d.preview)}</div>
       <button class="del" data-del="${d.id}" title="Удалить">✕</button>
     </div>`).join("") || '<div style="padding:12px;color:var(--muted);font-size:12px">История пуста</div>';
}
$("dlgList").addEventListener("click", e => {
  const del = e.target.closest("[data-del]");
  if (del){ e.stopPropagation(); api("/aichat/api/dialogs/"+del.dataset.del, {method:"DELETE"}).then(()=>{ if(cur===del.dataset.del){cur=null;renderMsgs([]);} loadList(); }); return; }
  const it = e.target.closest(".ac-item");
  if (it) open(it.dataset.id);
});
async function open(id){
  cur = id;
  const d = await api("/aichat/api/dialogs/"+id);
  renderMsgs(d.messages||[]);
  loadList();
}
function renderMsgs(msgs){
  $("msgs").innerHTML = msgs.length ? msgs.map(m =>
    `<div class="msg ${m.role==="user"?"user":"ai"}">${fmt(m.content)}
       ${m.file?`<span class="file">📎 ${esc(m.file)}</span>`:""}
       <span class="ts">${(m.ts||"").slice(11,16)}</span></div>`).join("")
    : `<div class="ac-empty"><div class="big">🤖</div>Начни диалог — история сохранится<br>и будет доступна с любого устройства сети.</div>`;
  $("msgs").scrollTop = 1e9;
}
function addBubble(role, content, file){
  const el = document.createElement("div");
  el.className = "msg " + (role==="user"?"user":"ai");
  el.innerHTML = fmt(content) + (file?`<span class="file">📎 ${esc(file)}</span>`:"");
  $("msgs").appendChild(el); $("msgs").scrollTop = 1e9;
}
function typing(on){
  let t = $("typing");
  if (on && !t){ t = document.createElement("div"); t.id="typing"; t.className="typing"; t.innerHTML="<i></i><i></i><i></i>"; $("msgs").appendChild(t); $("msgs").scrollTop=1e9; }
  if (!on && t) t.remove();
}
async function send(){
  if (busy) return;
  const text = $("inp").value.trim();
  const files = $("file").files;
  if (!text && !files.length) return;
  const fd = new FormData();
  fd.append("dialog_id", cur||"");
  fd.append("text", text);
  for (const f of files) fd.append("file", f);
  const fname = files.length ? [...files].map(f=>f.name).join(", ") : null;
  addBubble("user", text || "Приложены файлы: " + (fname||""), fname);
  $("inp").value = ""; $("file").value = ""; chips();
  busy = true; typing(true);
  try {
    const r = await api("/aichat/api/send", {method:"POST", body:fd});
    typing(false);
    if (r.error){ addBubble("ai", "⚠️ " + r.error); }
    else { cur = r.dialog_id; addBubble("ai", r.answer); }
  } catch(e){ typing(false); addBubble("ai", "⚠️ Сетевая ошибка: " + e.message); }
  busy = false; loadList();
}
function chips(){
  const n = $("file").files.length;
  $("chips").innerHTML = n ? [...$("file").files].map(f=>`<span class="chip">📎 ${esc(f.name)}</span>`).join("") : "";
}
$("sendBtn").onclick = send;
$("newBtn").onclick = async () => { const d = await api("/aichat/api/dialogs", {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"}); cur = d.id; renderMsgs([]); loadList(); };
$("attachBtn").onclick = () => $("file").click();
$("file").onchange = chips;
$("inp").addEventListener("keydown", e => { if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); } });
$("inp").addEventListener("input", () => { $("inp").style.height="auto"; $("inp").style.height=Math.min(140,$("inp").scrollHeight)+"px"; });

/* ── Диктовка голосом ── */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR){
  const rec = new SR(); rec.lang = "ru-RU"; rec.interimResults = true; rec.continuous = false;
  let base = "";
  rec.onresult = e => { let t = ""; for (const r of e.results) t += r[0].transcript; $("inp").value = (base ? base + " " : "") + t; };
  rec.onend = () => $("micBtn").classList.remove("on");
  rec.onerror = (e) => {
    $("micBtn").classList.remove("on");
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      alert("🎤 Диктовка запрещена политикой организации: браузер блокирует микрофон.\n" +
            "Обратитесь к системному администратору или откройте чат в браузере без корпоративных ограничений.");
    }
  };
  $("micBtn").onclick = () => {
    if ($("micBtn").classList.contains("on")) rec.stop();
    else { base = $("inp").value.trim(); rec.start(); $("micBtn").classList.add("on"); }
  };
} else {
  $("micBtn").title = "Диктовка не поддерживается этим браузером";
  $("micBtn").style.opacity = .4;
}
loadList();
</script>
</body>
</html>
