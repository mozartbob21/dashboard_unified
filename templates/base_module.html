<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <script>
    (function () {
        var mode = "auto-moscow";
        try { mode = localStorage.getItem("neurona-theme-mode") || mode; } catch (_) {}
        var theme = mode;
        if (mode === "auto-moscow") {
            var now = new Date(), start = new Date(now.getFullYear(), 0, 0);
            var day = Math.floor((now - start) / 86400000);
            var decl = .409 * Math.sin(2 * Math.PI * (day - 80) / 365), lat = 55.7558 * Math.PI / 180;
            var cosH = (Math.sin(-.83 * Math.PI / 180) - Math.sin(lat) * Math.sin(decl)) / (Math.cos(lat) * Math.cos(decl));
            var h = cosH >= 1 ? 0 : cosH <= -1 ? Math.PI : Math.acos(cosH);
            var sunrise = (12 - h * 12 / Math.PI - 37.6173 / 15 + 3 + 24) % 24;
            var sunset = (12 + h * 12 / Math.PI - 37.6173 / 15 + 3 + 24) % 24;
            var hour = now.getHours() + now.getMinutes() / 60;
            theme = hour >= sunrise && hour < sunset ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Нейрона ИИ{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v=stable_cards_20260912">
    {% block head %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', path='module-shell.css') }}?v=20260915-2">
    <script src="{{ url_for('static', path='module-shell.js') }}?v=20260915-2" defer></script>
</head>
<body class="unified-module-page {% block body_class %}{% endblock %}">
    {% block content %}{% endblock %}
</body>
</html>
