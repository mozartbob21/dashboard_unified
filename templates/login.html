<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нейрона ИИ — Вход</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <style>
        body.login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .login-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
        }
        .login-brand img { width: 48px; height: 48px; }
        .login-brand-title { font-size: 20px; font-weight: 700; color: #1e293b; }
        .login-brand-subtitle { font-size: 13px; color: #64748b; }
        .login-title { font-size: 26px; font-weight: 700; color: #1e293b; margin: 0 0 8px; }
        .login-subtitle { font-size: 14px; color: #64748b; margin-bottom: 28px; }
        .login-form { display: flex; flex-direction: column; gap: 16px; }
        .login-field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            margin-bottom: 6px;
        }
        .login-field input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.2s;
            font-family: inherit;
        }
        .login-field input:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }
        .login-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .login-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .login-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .login-info {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        /* ===== НОВОЕ: ссылка на регистрацию ===== */
        .login-register {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            color: #64748b;
        }
        .login-register a {
            color: #667eea;
            font-weight: 700;
            text-decoration: none;
        }
        .login-register a:hover {
            text-decoration: underline;
        }
        .login-hint {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.7;
        }
        .login-hint b { color: #475569; }
        .login-hint code {
            background: #f1f5f9;
            color: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: "SF Mono", Monaco, monospace;
            font-size: 11px;
        }
        .login-security-note {
            margin-top: 16px;
            padding: 10px 12px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            font-size: 11px;
            color: #15803d;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-brand">
            <img src="{{ url_for('static', path='logo.svg') }}" alt="Нейрона ИИ">
            <div>
                <div class="login-brand-title">Нейрона ИИ</div>
                <div class="login-brand-subtitle">Подмосковная Нейрона Роботовна</div>
            </div>
        </div>

        <h1 class="login-title">Вход в платформу</h1>
        <p class="login-subtitle">Введите логин и пароль, чтобы продолжить.</p>

        {% if message %}
        <div class="login-info">{{ message }}</div>
        {% endif %}

        {% if error %}
        <div class="login-error">⚠️ {{ error }}</div>
        {% endif %}

        <form method="post" action="/login" class="login-form">
            <div class="login-field">
                <label for="username">Логин</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="например, admin"
                    autofocus
                    autocomplete="username"
                    required>
            </div>

            <div class="login-field">
                <label for="password">Пароль</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Введите ваш пароль"
                    autocomplete="current-password"
                    required>
            </div>

            <button type="submit" class="login-button">
                Войти →
            </button>

        </form>

        <!-- ===== НОВОЕ: переход на регистрацию ===== -->
        <div class="login-register">
            Нет аккаунта? <a href="/register">Зарегистрироваться</a>
        </div>

        <div class="login-security-note">
            🔒 Локальная авторизация: bcrypt + JWT, без внешних сервисов.
        </div>
    </div>

<script>
(function(){
    function make(){
        var host = document.querySelector(".top-actions") || document.querySelector(".topbar");
        if (!host) { setTimeout(make, 300); return; }
        if (document.getElementById("glassToggle")) return;
        var b = document.createElement("button");
        b.id = "glassToggle";
        b.type = "button";
        host.insertBefore(b, host.firstChild);
        function paint(){
            var on = document.documentElement.getAttribute("data-glass") === "on";
            var SVG_ON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c4.2 5.6 7 9.3 7 13a7 7 0 1 1-14 0c0-3.7 2.8-7.4 7-13z"/></svg>';
            var SVG_OFF = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3c3.7 5 6.3 8.4 6.3 11.8a6.3 6.3 0 1 1-12.6 0C5.7 11.4 8.3 8 12 3z"/></svg>';
            b.innerHTML = on ? SVG_ON : SVG_OFF;
            b.classList.toggle("on", on);
            b.title = on ? "Жидкое стекло: вкл" : "Жидкое стекло: выкл";
        }
        b.addEventListener("click", function(){
            var on = document.documentElement.getAttribute("data-glass") === "on";
            document.documentElement.setAttribute("data-glass", on ? "off" : "on");
            localStorage.setItem("neurona-glass", on ? "off" : "on");
            paint();
        });
        paint();
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", make);
    else make();
})();
</script>
</body>
</html>
