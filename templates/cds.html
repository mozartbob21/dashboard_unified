    <script>
        (function() {
            const savedThemeMode = localStorage.getItem("neurona-theme-mode") || "auto-moscow";
            let activeTheme = savedThemeMode;
            if (savedThemeMode === "auto-moscow") {
                const MOSCOW_LAT = 55.7558;
                const MOSCOW_LON = 37.6173;
                const MOSCOW_TZ = 3;
                const now = new Date();
                const start = new Date(now.getFullYear(), 0, 0);
                const diff = now - start;
                const oneDay = 1000 * 60 * 60 * 24;
                const dayOfYear = Math.floor(diff / oneDay);
                const decl = 0.409 * Math.sin(2 * Math.PI * (dayOfYear - 80) / 365);
                const latRad = MOSCOW_LAT * Math.PI / 180;
                const cosH = (Math.sin(-0.83 * Math.PI / 180) - Math.sin(latRad) * Math.sin(decl)) / (Math.cos(latRad) * Math.cos(decl));
                let H = cosH >= 1 ? 0 : cosH <= -1 ? Math.PI : Math.acos(cosH);
                const sunriseGMT = 12 - (H * 12 / Math.PI) - (MOSCOW_LON / 15);
                const sunsetGMT = 12 + (H * 12 / Math.PI) - (MOSCOW_LON / 15);
                const sunriseLocal = (sunriseGMT + MOSCOW_TZ + 24) % 24;
                const sunsetLocal = (sunsetGMT + MOSCOW_TZ + 24) % 24;
                const currentHour = now.getHours() + now.getMinutes() / 60;
                activeTheme = (currentHour >= sunriseLocal && currentHour < sunsetLocal) ? "light" : "dark";
            }
            document.documentElement.setAttribute("data-theme", activeTheme);
            document.documentElement.dataset.theme = activeTheme;
        })();
    </script>

<script>
    const SLA_DAYS = 3;
    const TODAY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();

    // Активные («в работе») статусы — попадают в отчёт как нерешённые.
    // Остальные считаются закрытыми и учитываются в колонке «Всего закрыто».
    const ALLOWED_STATUSES = ['Новое', 'В работе', 'Перенос сроков', 'Отложено на следующий день'];
    const ALLOWED_SET = new Set(ALLOWED_STATUSES.map(s => s.toLowerCase().replace(/\s+/g,' ').trim()));
    function isAllowedStatus(status){
        return ALLOWED_SET.has(String(status||'').toLowerCase().replace(/\s+/g,' ').trim());
    }

    // Псевдо-подразделения — игнорируем в сводке
    const EXCLUDED_DEPTS = new Set(['Лист_1', 'Лист1', 'Sheet1', 'Sheet']);

    let appData = {};                       // { "Подразделение": [активные заявки...] }
    let closedCounts = {};                  // { "Подразделение": число закрытых }
    let statusTotals = {};                  // { "Статус": число (по всем — активные + закрытые) }

    let sortState = { column: null, direction: 'asc', deptColumn: null, deptDirection: 'asc' };
    let chartPie = null, chartBar = null;
    let summaryStatusFilter = '';
    let summaryDueFilter = '';
    let modalRegistry = [];
    const OVERDUE_FILTER = '__overdue__';
    const CLOSED_FILTER  = '__closed__';
    const STATUS_PALETTE = ['#3b82f6','#f97316','#8b5cf6','#10b981','#f59e0b','#ef4444','#06b6d4','#ec4899','#84cc16','#6366f1','#14b8a6','#a855f7'];

    // ===== Период по умолчанию: прошлый месяц =====
    (function initPeriod(){
        const now = new Date();
        const start = new Date(now.getFullYear(), now.getMonth()-1, 1);
        const end   = new Date(now.getFullYear(), now.getMonth()+1, 0);
        const fmt = d => d.toISOString().slice(0,10);
        document.getElementById('dateFrom').value = fmt(start);
        document.getElementById('dateTo').value   = fmt(end);
    })();

    // ===== Запуск выгрузки через бэкенд =====
    async function runExport(){
        const btn = document.getElementById('btnExport');
        const dateFrom = document.getElementById('dateFrom').value;
        const dateTo   = document.getElementById('dateTo').value;
        if(!dateFrom || !dateTo){ alert('Укажите период'); return; }

        btn.disabled = true; btn.textContent = '⏳ Выгрузка...';

        const emptyHint = document.getElementById('emptyHint');
        if (emptyHint) emptyHint.style.display = 'none';

        const loader = document.getElementById('loader');
        if (loader) {
            loader.style.display = 'block';
            loader.textContent = 'Выполняется выгрузка из 1С... Это может занять несколько минут.';
        }
        const tabs = document.getElementById('tabsContainer');
        if (tabs) tabs.innerHTML = '';

        try{
            const res = await fetch('/api/cds/export', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                credentials:'same-origin',
                body: JSON.stringify({ date_from: dateFrom, date_to: dateTo })
            });
            const data = await res.json();
            if(!data.success) throw new Error(data.error || 'Ошибка выгрузки');

            applyRows(data.rows || []);
            sortState = { column:null, direction:'asc', deptColumn:null, deptDirection:'asc' };
            summaryStatusFilter = '';
            summaryDueFilter = '';
            renderAll();
            showLastCheck({ timestamp: new Date().toISOString(), date_from: dateFrom, date_to: dateTo });
        }catch(e){
            document.getElementById('contentContainer').innerHTML =
                `<div class="empty-state">❌ ${escapeHtml(e.message)}</div>`;
        }finally{
            btn.disabled = false; btn.textContent = '⬆️ Запустить выгрузку';
            if (loader) loader.style.display = 'none';
        }
    }

    // ===== Конвертация плоского массива бэка =====
    // Разделяем на активные (appData) и закрытые (closedCounts), считаем statusTotals.
    function applyRows(rows){
        const out = {};
        const closed = {};
        const totals = {};
        rows.forEach(r => {
            const dept = (r.department || '').trim() || '(не указано)';
            if (EXCLUDED_DEPTS.has(dept)) return;

            const status = (r.status || '').trim();
            const statusKey = status || 'Без статуса';
            totals[statusKey] = (totals[statusKey] || 0) + 1;

            if (!isAllowedStatus(status)) {
                closed[dept] = (closed[dept] || 0) + 1;
                return;
            }

            const fields = [
                {label:'Дата', value:r.date},
                {label:'Подразделение', value:r.department},
                {label:'Номер', value:r.number},
                {label:'Состояние обращения', value:r.status},
                {label:'Адрес обращения', value:r.address},
                {label:'Тип обращения', value:r.type},
                {label:'Срок исполнения', value:r.deadline},
                {label:'Тип заявки', value:r.request_type},
                {label:'Источник поступления', value:r.source},
                {label:'Заявитель', value:r.applicant},
                {label:'Исполнитель', value:r.executor},
                {label:'Причина обращения', value:r.reason},
            ];
            const req = {
                date: r.date || '',
                department: dept,
                number: r.number || '',
                status: status,
                address: r.address || '',
                reason: r.reason || '',
                deadline: r.deadline || '',
                fields
            };
            (out[dept] = out[dept] || []).push(req);
        });
        appData = out;
        closedCounts = closed;
        statusTotals = totals;
    }

    // ===== Даты / просрочка =====
    function parseExcelDate(value){
        if(!value && value!==0) return "";
        if(typeof value === 'string'){
            const t = value.trim();
            if(/^\d+\.?\d*$/.test(t)) return parseExcelSerialDate(parseFloat(t));
            return t;
        }
        if(typeof value === 'number') return parseExcelSerialDate(value);
        return String(value);
    }
    function parseExcelSerialDate(serial){
        if(serial < 1){
            const totalMinutes = Math.round(serial*24*60);
            const hours = Math.floor(totalMinutes/60);
            const minutes = totalMinutes % 60;
            return `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}`;
        }
        const excelEpoch = new Date(1899,11,31);
        const date = new Date(excelEpoch.getTime() + serial*86400000);
        if(serial <= 60) date.setDate(date.getDate()-1);
        const d = String(date.getDate()).padStart(2,'0');
        const m = String(date.getMonth()+1).padStart(2,'0');
        const y = date.getFullYear();
        const h = String(date.getHours()).padStart(2,'0');
        const mi = String(date.getMinutes()).padStart(2,'0');
        const s = String(date.getSeconds()).padStart(2,'0');
        return `${d}.${m}.${y} ${h}:${mi}:${s}`;
    }

    function getDaysSince(dateStr){
        if(!dateStr) return 0;
        const p = parseExcelDate(dateStr);
        if(/^\d{1,2}:\d{2}$/.test(String(p).trim())) return 0;
        const m = String(p).match(/(\d{2})\.(\d{2})\.(\d{4})/);
        if(m){ const d=new Date(m[3],m[2]-1,m[1]); return Math.ceil(Math.abs(TODAY-d)/(86400000)); }
        return 0;
    }
    function parseDateTime(value){
        if(!value) return null;
        const p = parseExcelDate(value);
        const m = String(p).match(/(\d{2})\.(\d{2})\.(\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
        if(!m) return null;
        return new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0));
    }
    function getDeadlineStr(req){
        if(!req) return '';
        if(req.deadline) return req.deadline;
        if(Array.isArray(req.fields)){
            const f = req.fields.find(x=>(x.label||'').toLowerCase().includes('срок исполнения'));
            if(f) return f.value||'';
        }
        return '';
    }
    function hasDeadline(req){ return !!parseDateTime(getDeadlineStr(req)); }

    function usesDeadline(req){
        return (req && (req.status||'').includes('Перенос')) && !!parseDateTime(getDeadlineStr(req));
    }
    function getOverdueDays(reqOrDate){
        const req = (reqOrDate && typeof reqOrDate==='object') ? reqOrDate : {date:reqOrDate};
        if(usesDeadline(req)){
            const dlDay = new Date(parseDateTime(getDeadlineStr(req))); dlDay.setHours(0,0,0,0);
            const diff = Math.round((TODAY-dlDay)/86400000);
            return diff>0?diff:0;
        }
        return Math.max(0, getDaysSince(req.date)-SLA_DAYS);
    }
    function getDateValue(dateStr){
        const p = parseExcelDate(dateStr);
        const m = String(p).match(/(\d{2})\.(\d{2})\.(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
        if(m) return new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0)).getTime();
        return TODAY.getTime();
    }
    function getStatusClass(status){
        if(!status) return "";
        if(status.includes("Новое")) return "status-new";
        if(status.includes("В работе")) return "status-work";
        if(status.includes("Перенос")) return "status-postponed";
        if(status.includes("Отложено")) return "status-deferred";
        if(status.includes("Возвращено")) return "status-returned";
        if(status.includes("Хроническая")) return "status-chronic";
        return "";
    }
    function escapeHtml(s){
        return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function registerReq(req){ modalRegistry.push(req); return modalRegistry.length-1; }
    function openModalByIndex(i){ openModal(modalRegistry[i]); }

    function pctOf(v, total){ return total > 0 ? Math.round(v/total*100) + '%' : '0%'; }

    // ===== Эффективный срок «нужно закрыть» =====
    function getDueDate(req){
        if(usesDeadline(req)){
            const dl = parseDateTime(getDeadlineStr(req));
            if(dl){ dl.setHours(0,0,0,0); return dl; }
        }
        const c = parseDateTime(req && req.date);
        const x = c ? new Date(c) : new Date(TODAY);
        x.setHours(0,0,0,0);
        x.setDate(x.getDate() + SLA_DAYS);
        return x;
    }

    function getDateWindows(){
        const today = new Date(TODAY); today.setHours(0,0,0,0);
        const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);
        const dow = today.getDay();
        const endOfWeek = new Date(today); endOfWeek.setDate(today.getDate() + (dow===0 ? 0 : 7-dow));
        const endOfMonth = new Date(today.getFullYear(), today.getMonth()+1, 0);
        return { today, tomorrow, endOfWeek, endOfMonth };
    }

    function matchesDueFilter(req, bucket){
        const w = getDateWindows();
        const d = getDueDate(req);
        switch(bucket){
            case 'overdue':  return d < w.today;
            case 'today':    return +d === +w.today;
            case 'tomorrow': return +d === +w.tomorrow;
            case 'week':     return d >= w.today && d <= w.endOfWeek;
            case 'month':    return d >= w.today && d <= w.endOfMonth;
            default:         return true;
        }
    }

    function calcDeadlineKPIs(){
        const w = getDateWindows();
        const k = { total:0, overdue:0, today:0, tomorrow:0, week:0, month:0 };
        for(const reqs of Object.values(appData)){
            for(const r of reqs){
                k.total++;
                const d = getDueDate(r);
                if(d < w.today) k.overdue++;
                else if(+d === +w.today) k.today++;
                else if(+d === +w.tomorrow) k.tomorrow++;
                if(d >= w.today && d <= w.endOfWeek) k.week++;
                if(d >= w.today && d <= w.endOfMonth) k.month++;
            }
        }
        return k;
    }

    // ===== Список подразделений =====
    function getSummaryDepts(){
        const set = new Set(Object.keys(appData));
        for(const d in closedCounts) if(closedCounts[d] > 0) set.add(d);
        return [...set].filter(d => !EXCLUDED_DEPTS.has(d));
    }

    function getAllStatuses(){
        const counts = new Map();
        for(const reqs of Object.values(appData)) reqs.forEach(r=>{const s=(r.status||'').trim(); if(s) counts.set(s,(counts.get(s)||0)+1);});
        return [...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ru')).map(e=>e[0]);
    }

    function getActiveReqs(){
        if(!summaryStatusFilter && !summaryDueFilter) return appData;
        const out = {};
        for(const [dept,reqs] of Object.entries(appData)){
            let arr;
            if(summaryStatusFilter === CLOSED_FILTER) arr = [];
            else if(summaryStatusFilter === OVERDUE_FILTER) arr = reqs.filter(r=>getOverdueDays(r)>0);
            else if(summaryStatusFilter) arr = reqs.filter(r=>(r.status||'').trim()===summaryStatusFilter);
            else arr = reqs.slice();
            if(summaryDueFilter) arr = arr.filter(r => matchesDueFilter(r, summaryDueFilter));
            out[dept] = arr;
        }
        return out;
    }

    function getStatusList(){
        const counts = new Map();
        for(const reqs of Object.values(getActiveReqs())) reqs.forEach(r=>{const s=(r.status||'').trim(); if(s) counts.set(s,(counts.get(s)||0)+1);});
        return [...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ru')).map(e=>e[0]);
    }

    function calculateSummary(){
        const statuses = getStatusList();
        const activeData = getActiveReqs();
        const summary = { __statuses: statuses };
        const totals = { dept:"ИТОГО", total:0, closed:0, totalAll:0, timeOnly:0, overdueCount:0, isTotal:true, statusCounts:{} };
        statuses.forEach(s=>totals.statusCounts[s]=0);

        getSummaryDepts().forEach(dept=>{
            const reqs = activeData[dept] || [];
            const closed = closedCounts[dept] || 0;
            const row = { dept, total:reqs.length, closed, totalAll:reqs.length+closed, timeOnly:0, overdueCount:0, statusCounts:{} };
            statuses.forEach(s=>row.statusCounts[s]=0);
            reqs.forEach(req=>{
                const s=(req.status||'').trim();
                if(s && row.statusCounts[s]!==undefined) row.statusCounts[s]++;
                if(/^\d{1,2}:\d{2}$/.test(parseExcelDate(req.date).trim())) row.timeOnly++;
                if(getOverdueDays(req)>0) row.overdueCount++;
            });
            summary[dept]=row;
            statuses.forEach(s=>totals.statusCounts[s]+=row.statusCounts[s]);
            totals.total+=row.total;
            totals.closed+=row.closed;
            totals.totalAll+=row.totalAll;
            totals.timeOnly+=row.timeOnly;
            totals.overdueCount+=row.overdueCount;
        });
        summary["ИТОГО"]=totals;
        return summary;
    }

    function getSortedSummaryDepts(summaryData){
        const depts = getSummaryDepts();
        if(!sortState.column) return depts;
        const col = sortState.column;
        const dir = sortState.direction==='asc'?1:-1;
        const getVal = d => col==='dept'
            ? summaryData[d].dept
            : (col.startsWith('st:') ? (summaryData[d].statusCounts[col.slice(3)]||0) : summaryData[d][col]);
        return [...depts].sort((a,b)=>{
            const va=getVal(a), vb=getVal(b);
            if(typeof va==='string') return va.localeCompare(vb,'ru')*dir;
            return (va-vb)*dir;
        });
    }

    function applyStatusFilter(val){
        summaryStatusFilter = val||'';
        const summaryData = calculateSummary();
        const el = document.getElementById('tab-summary');
        if(el){ el.innerHTML = renderSummaryTable(summaryData); setTimeout(()=>renderCharts(summaryData),50); }
    }

    function applyDueFilter(bucket){
        summaryDueFilter = (summaryDueFilter === bucket) ? '' : bucket;
        const summaryData = calculateSummary();
        const el = document.getElementById('tab-summary');
        if(el){ el.innerHTML = renderSummaryTable(summaryData); setTimeout(()=>renderCharts(summaryData),50); }
    }

    function getAllOverdueRequests(){
        const overdue = [];
        for(const [dept,reqs] of Object.entries(appData)){
            reqs.forEach(req=>{
                const days = getDaysSince(req.date);
                const od = getOverdueDays(req);
                if(od>0){
                    overdue.push({ ...req, dept, daysSince: days, overdueDays: od });
                }
            });
        }
        overdue.sort((a,b)=>b.overdueDays-a.overdueDays);
        return overdue;
    }

    // ===== Рендер всего интерфейса =====
    function renderAll(){
        modalRegistry = [];
        renderTabs();
        const summaryData = calculateSummary();
        const content = document.getElementById('contentContainer');
        content.innerHTML = '';

        const summaryTab = document.createElement('div');
        summaryTab.id = 'tab-summary';
        summaryTab.className = 'tab-content active';
        summaryTab.innerHTML = renderSummaryTable(summaryData);

        const overdueTab = document.createElement('div');
        overdueTab.id = 'tab-overdue';
        overdueTab.className = 'tab-content';
        overdueTab.innerHTML = renderOverdueTable();
        content.appendChild(overdueTab);

        Object.keys(appData).forEach((dept, idx)=>{

            tab.id = 'tab-dept-' + idx;
            tab.className = 'tab-content';
            tab.innerHTML = renderDeptTable(dept);
            content.appendChild(tab);
        });

    }

    function renderTabs(){
        const overdueCount = getAllOverdueRequests().length;
        const tabs = document.getElementById('tabsContainer');
        let html = `<button class="tab-button active" onclick="switchTab(this,'tab-summary')">📊 Сводка</button>`;
        html += `<button class="tab-button overdue-tab" onclick="switchTab(this,'tab-overdue')">⚠️ Просрочено (${overdueCount})</button>`;
        Object.keys(appData).forEach((dept, idx)=>{
            html += `<button class="tab-button" onclick="switchTab(this,'tab-dept-${idx}')">${escapeHtml(dept)}</button>`;
        });
        tabs.innerHTML = html;
    }

    function switchTab(btn, tabId){
        document.querySelectorAll('.tab-button').forEach(b=>b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
        btn.classList.add('active');
        const el = document.getElementById(tabId);
        if(el) el.classList.add('active');
    }

    // ===== Сводная таблица =====
    function renderSummaryTable(summary){
        const statuses = summary.__statuses || [];
        const sortedDepts = getSortedSummaryDepts(summary);

        const dirIcon = col => sortState.column!==col ? '⇅' : (sortState.direction==='asc'?'↑':'↓');

        const allStatuses = getAllStatuses();
        let statusOptions = `<option value=""${summaryStatusFilter===''?' selected':''}>Все статусы</option>`;
        statusOptions += `<option value="${OVERDUE_FILTER}"${summaryStatusFilter===OVERDUE_FILTER?' selected':''}>⏱ Просроченные</option>`;
        statusOptions += `<option value="${CLOSED_FILTER}"${summaryStatusFilter===CLOSED_FILTER?' selected':''}>✅ Закрыто</option>`;
        allStatuses.forEach(s=>{
            statusOptions += `<option value="${escapeHtml(s)}"${summaryStatusFilter===s?' selected':''}>${escapeHtml(s)}</option>`;
        });

        const filterHint = summaryStatusFilter === OVERDUE_FILTER
            ? 'Показаны только просроченные заявки'
            : summaryStatusFilter === CLOSED_FILTER
                ? 'Показаны закрытые заявки (колонка «Всего закрыто»)'
                : (summaryStatusFilter ? `Показаны только заявки со статусом «${escapeHtml(summaryStatusFilter)}»` : '');

        let statusHeaders = '';
        statuses.forEach(s=>{
            const col = 'st:'+s;
            statusHeaders += `<th class="sortable ${sortCls(col)}" data-col="${escapeHtml(col)}">${escapeHtml(s)} <span class="sort-icon">${dirIcon(col)}</span></th>`;
        });

        // KPI-плитки
        const kpi = calcDeadlineKPIs();
        const kpiTile = (label, val, bucket, colorKey) => {
            const active = bucket && summaryDueFilter === bucket;
            return `<div class="kpi-tile k-${colorKey} ${active?'active':''}" onclick="applyDueFilter('${bucket}')" title="Показать: ${escapeHtml(label)}">
                <div class="kpi-label">${escapeHtml(label)}</div>
                <div class="kpi-value">${val}</div>
            </div>`;
        };
        const kpiTiles = `<div class="kpi-grid">
            ${kpiTile('Просрочено', kpi.overdue, 'overdue', 'overdue')}
            ${kpiTile('Сегодня', kpi.today, 'today', 'today')}
            ${kpiTile('Завтра', kpi.tomorrow, 'tomorrow', 'tomorrow')}
            ${kpiTile('До конца недели', kpi.week, 'week', 'week')}
            ${kpiTile('До конца месяца', kpi.month, 'month', 'month')}
            ${kpiTile('Всего в работе', kpi.total, '', 'total')}
        </div>`;

        let html = `
        <h2>Сводка: Нерешённые заявки по подразделениям</h2>
        <div class="disclaimer">
            ⚠️ Просрочка считается от <b>даты создания</b> с нормативом <b>${SLA_DAYS} дня</b>. При статусе <b>«Перенос сроков»</b> расчёт ведётся по <b>дате исполнения</b> (сроку).<br>
            <b>Итого активных</b> — заявки в работе. <b>Всего закрыто</b> — прочие статусы. <b>Итого задач</b> = активные + закрытые.
        </div>

        <div class="filter-bar">
            <label class="filter-label" for="statusFilter">Фильтр по статусу:</label>
            <select id="statusFilter" class="filter-select" onchange="applyStatusFilter(this.value)">${statusOptions}</select>
            ${filterHint ? `<span class="filter-hint">${filterHint}</span>` : ''}
        </div>

        <div class="chart-card" style="margin-bottom:20px;">
            <h3>🗓 Сроки исполнения (активные) — клик по плитке фильтрует сводку</h3>
            ${kpiTiles}
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3>📈 Распределение по статусам (все)</h3>
                <div class="chart-container"><canvas id="chartPie"></canvas></div>
            </div>
            <div class="chart-card">
                <h3>📊 Заявки по подразделениям</h3>
                <div class="chart-container"><canvas id="chartBar"></canvas></div>
            </div>
        </div>

        <div class="table-wrapper"><table><thead><tr>
            <th class="sortable ${sortCls('dept')}" data-col="dept">Подразделение <span class="sort-icon">${dirIcon('dept')}</span></th>
            ${statusHeaders}
            <th class="sortable ${sortCls('total')}" data-col="total">Итого активных <span class="sort-icon">${dirIcon('total')}</span></th>
            <th class="sortable ${sortCls('closed')}" data-col="closed">Всего закрыто <span class="sort-icon">${dirIcon('closed')}</span></th>
            <th class="sortable ${sortCls('totalAll')}" data-col="totalAll">Итого задач <span class="sort-icon">${dirIcon('totalAll')}</span></th>
            <th class="sortable ${sortCls('timeOnly')}" data-col="timeOnly">Заявки от сегодня <span class="sort-icon">${dirIcon('timeOnly')}</span></th>
            <th class="sortable ${sortCls('overdueCount')} overdue-text" data-col="overdueCount">Просрочено <span class="sort-icon">${dirIcon('overdueCount')}</span></th>
        </tr></thead><tbody>`;

        sortedDepts.forEach(dept=>{
            const row = summary[dept];
            if(!row) return;
            html += `<tr><td><b>${escapeHtml(dept)}</b></td>`;
            statuses.forEach(s=>{ html += `<td>${row.statusCounts[s]||0}</td>`; });
            html += `<td>${row.total} <span class="muted-inline">(${pctOf(row.total, row.totalAll)})</span></td>`;
            html += `<td>${row.closed} <span class="muted-inline">(${pctOf(row.closed, row.totalAll)})</span></td>`;
            html += `<td><b>${row.totalAll}</b></td>`;
            html += `<td>${row.timeOnly}</td>`;
            html += `<td class="${row.overdueCount>0?'overdue-text':''}">${row.overdueCount}</td></tr>`;
        });

        const t = summary['ИТОГО'];
        if(t){
            html += `<tr style="background:var(--bg-soft);font-weight:700;"><td>ИТОГО</td>`;
            statuses.forEach(s=>{ html += `<td>${t.statusCounts[s]||0}</td>`; });
            html += `<td>${t.total} <span class="muted-inline">(${pctOf(t.total, t.totalAll)})</span></td>`;
            html += `<td>${t.closed} <span class="muted-inline">(${pctOf(t.closed, t.totalAll)})</span></td>`;
            html += `<td>${t.totalAll}</td><td>${t.timeOnly}</td><td class="overdue-text">${t.overdueCount}</td></tr>`;
        }
        html += `</tbody></table></div>`;
        return html;
    }

    function renderCharts(summary){
        const statuses = summary.__statuses || [];
        const depts = getSummaryDepts();
        window.__cdsLastSummary = summary;

        const pieEl = document.getElementById('chartPie');
        const barEl = document.getElementById('chartBar');
        if(!pieEl || !barEl) return;

        if(chartPie) chartPie.destroy();
        if(chartBar) chartBar.destroy();

        const css = getComputedStyle(document.documentElement);
        const cText   = css.getPropertyValue('--text').trim()   || '#1e293b';
        const cMuted  = css.getPropertyValue('--muted').trim()  || '#64748b';
        const cBorder = css.getPropertyValue('--border').trim() || 'rgba(0,0,0,.1)';

        // Круговая — по всем статусам (statusTotals), нулевые убираем
        let statusEntries = Object.entries(statusTotals)
            .filter(([, v]) => v > 0)
            .sort((a, b) => b[1] - a[1]);
        if (statusEntries.length === 0) {
            const t = summary['ИТОГО'] || {statusCounts:{}};
            statusEntries = statuses.map(s => [s, t.statusCounts[s] || 0]).filter(([, v]) => v > 0);
        }
        const pieLabels = statusEntries.map(e => e[0]);
        const pieData = statusEntries.map(e => e[1]);
        const pieColors = statusEntries.map((_, i) => STATUS_PALETTE[i % STATUS_PALETTE.length]);

        chartPie = new Chart(pieEl, {
            type:'doughnut',
            data:{ labels:pieLabels, datasets:[{ data:pieData, backgroundColor:pieColors, borderWidth:2, borderColor:'#fff' }] },
            options:{ responsive:true, maintainAspectRatio:false,
                plugins:{
                    legend:{ position:'bottom', labels:{ color:cText, font:{size:11}, boxWidth:12 } },
                    tooltip:{ callbacks:{ label:function(ctx){
                        const v=ctx.parsed||0, sum=ctx.dataset.data.reduce((a,b)=>a+b,0);
                        const p=sum?((v/sum)*100).toFixed(1):0;
                        return `${ctx.label||''}: ${v} (${p}%)`;
                    }}}
                } }
        });

        // Столбчатая — сортировка по убыванию активных заявок
        const barDepts = [...depts].sort((a,b)=>(summary[b].total||0)-(summary[a].total||0));
        chartBar = new Chart(barEl, {
            type:'bar',
            data:{ labels:barDepts, datasets:[
                { label:'Всего заявок', data:barDepts.map(d=>summary[d].total), backgroundColor:'#3b82f6', borderRadius:4 },
                { label:'Просрочено',   data:barDepts.map(d=>summary[d].overdueCount), backgroundColor:'#ef4444', borderRadius:4 }
            ]},
            options:{ responsive:true, maintainAspectRatio:false,
                scales:{
                    y:{ beginAtZero:true, ticks:{ precision:0, color:cMuted }, grid:{ color:cBorder } },
                    x:{ ticks:{ color:cMuted }, grid:{ color:cBorder } }
                },
                plugins:{ legend:{ position:'bottom', labels:{ color:cText } } } }
        });
    }

    // ===== Таблица по подразделению (с сортировкой + скачивание) =====
    function renderDeptTable(dept){
        let reqs = (appData[dept]||[]).slice();
        const col = sortState.deptColumn;
        if(col){
            const dir = sortState.deptDirection==='asc'?1:-1;
            reqs.sort((a,b)=>{
                let av, bv;
                if(col==='date'){ av=getDateValue(a.date); bv=getDateValue(b.date); return (av-bv)*dir; }
                if(col==='days'){ av=getDaysSince(a.date); bv=getDaysSince(b.date); return (av-bv)*dir; }
                if(col==='overdue'){ av=getOverdueDays(a); bv=getOverdueDays(b); return (av-bv)*dir; }
                av=(a[col]||'').toString(); bv=(b[col]||'').toString();
                return av.localeCompare(bv,'ru')*dir;
            });
        } else {
            reqs.sort((a,b)=>getDateValue(a.date)-getDateValue(b.date));
        }

        const ico = c => sortState.deptColumn===c ? (sortState.deptDirection==='asc'?'▲':'▼') : '⇅';
        const closed = closedCounts[dept] || 0;
        const overdueCount = reqs.filter(r=>getOverdueDays(r)>0).length;
        const timeOnly = reqs.filter(r=>/^\d{1,2}:\d{2}$/.test(parseExcelDate(r.date).trim())).length;

        let html = `
        <div class="overdue-header">
            <h2 style="border:none;margin:0;">${escapeHtml(dept)}</h2>
            <button class="btn btn-excel" data-dept="${escapeHtml(dept)}" onclick="downloadDeptToExcel(this.dataset.dept)">⬇️ Скачать задачи</button>
        </div>
        <span class="info-badge">Активных: ${reqs.length} | Закрыто: ${closed} | Заявки от сегодня: ${timeOnly} | Просрочено: ${overdueCount}</span>
        <div class="table-wrapper"><table><thead><tr>
            <th class="sortable nowrap" onclick="sortDept('${escapeHtml(dept)}','date')">Дата создания <span class="sort-icon">${ico('date')}</span></th>
            <th class="sortable nowrap" onclick="sortDept('${escapeHtml(dept)}','days')">Дней <span class="sort-icon">${ico('days')}</span></th>
            <th>Адрес заявки</th>
            <th class="sortable nowrap" onclick="sortDept('${escapeHtml(dept)}','number')">Номер заявки <span class="sort-icon">${ico('number')}</span></th>
            <th>Причина обращения</th>
            <th class="sortable nowrap" onclick="sortDept('${escapeHtml(dept)}','status')">Состояние <span class="sort-icon">${ico('status')}</span></th>
            <th class="nowrap">Действие</th>
        </tr></thead><tbody>`;

        reqs.forEach(req=>{
            const idx = registerReq(req);
            const od = getOverdueDays(req);
            const days = getDaysSince(req.date);
            html += `<tr class="${od>0?'overdue-row':''}">
                <td class="nowrap">${escapeHtml(parseExcelDate(req.date))}</td>

        });
        html += `</tbody></table></div>`;
        return html;
    }

    // ===== Модалка =====
    function openModal(req){

        const days = getDaysSince(req.date);
        const od = getOverdueDays(req);

        const overdueLabel = byDeadline ? 'Просрочка (по сроку исполнения)' : `Просрочка (норматив ${SLA_DAYS} дня)`;
        const overdueHtml = od > 0

        document.getElementById('modalDerived').innerHTML = `
            <div class="modal-derived-grid">

        const fields = Array.isArray(req.fields)?req.fields:[];

                valHtml = `<span class="status-badge ${getStatusClass(val)}">${escapeHtml(val)}</span>`;

                valHtml = `<a href="${escapeHtml(val)}" target="_blank" rel="noopener">${escapeHtml(val)}</a>`;
            } else {
                valHtml = escapeHtml(val);
            }
            return `<div class="modal-field"><div class="modal-label">${escapeHtml(label)}</div><div class="modal-value">${valHtml}</div></div>`;
        }).join('') || '<div class="modal-value">Нет данных</div>';

        document.getElementById('requestModal').style.display = 'block';
    }
    function closeModal(){ document.getElementById('requestModal').style.display='none'; }

    // ===== Сортировка сводной таблицы (делегирование) =====
    document.addEventListener('click', function(e){
        const th = e.target.closest('#tab-summary th.sortable');

    // ===== Выгрузка просрочки в Excel =====
    function downloadOverdueToExcel(){
        const overdue = getAllOverdueRequests();
        if(overdue.length===0){ alert('Просроченных заявок нет'); return; }
        const rows = overdue.map(r=>({
            'Подразделение': r.dept,
            'Номер': r.number,
            'Дата': parseExcelDate(r.date),
            'Срок исполнения': getDeadlineStr(r),
            'Статус': r.status,
            'Адрес': r.address,
            'Причина': r.reason,
            'Дней с создания': r.daysSince,
            'Просрочка (дней)': r.overdueDays
        }));
        const ws = XLSX.utils.json_to_sheet(rows);
        ws['!cols'] = [{wch:15},{wch:15},{wch:20},{wch:20},{wch:18},{wch:50},{wch:30},{wch:16},{wch:16}];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Просрочено');
        const d = new Date().toISOString().slice(0,10);
        XLSX.writeFile(wb, `просрочка_${d}.xlsx`);
    }

    // ===== Скачать задачи конкретного подразделения =====
    function downloadDeptToExcel(deptName){
        const reqs = appData[deptName] || [];
        if(reqs.length === 0){ alert('Нет задач для скачивания.'); return; }
        const labels = (reqs[0].fields || []).map(f => f.label);
        const header = labels.length ? labels : ['Дата','Номер','Состояние','Адрес','Причина'];
        const excelData = [header];
        reqs.forEach(r => {
            if(r.fields && r.fields.length) excelData.push(r.fields.map(f => f.value));
            else excelData.push([parseExcelDate(r.date), r.number, r.status, r.address, r.reason]);
        });
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(excelData);
        const safeSheet = (deptName || 'Заявки').replace(/[:\\\/?*\[\]]/g,' ').slice(0,31);
        XLSX.utils.book_append_sheet(wb, ws, safeSheet);
        const dateStr = new Date().toISOString().slice(0,10);
        XLSX.writeFile(wb, `задачи_${deptName}_${dateStr}.xlsx`);
    }

    // Перерисовка графиков при смене темы
    (function(){
        let _themeTimer = null;
        const _obs = new MutationObserver(muts=>{
            for(const m of muts){
                if(m.attributeName === 'data-theme'){
                    clearTimeout(_themeTimer);
                    _themeTimer = setTimeout(()=>{
                        if(window.__cdsLastSummary) renderCharts(window.__cdsLastSummary);
                    }, 60);
                    break;
                }
            }
        });
        _obs.observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
    })();

    // Время последней проверки
    function showLastCheck(info){
        const bar = document.getElementById('lastCheckBar');
        if(!bar) return;
        if(!info || !info.timestamp){ bar.style.display='none'; return; }
        let when = info.timestamp;
        try {
            const d = new Date(info.timestamp);
            if(!isNaN(d)) when = d.toLocaleString('ru-RU', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
        } catch(e){}
        const period = (info.date_from && info.date_to) ? (' \u2022 период: ' + info.date_from + ' \u2014 ' + info.date_to) : '';
        bar.textContent = '\u{1F552} Последняя проверка: ' + when + period;
        bar.style.display='block';
    }

    async function loadLastResult(){
        try{
            const res = await fetch('/api/cds/last-result', { credentials:'same-origin' });
            const data = await res.json();
            if(!data || !data.success || !Array.isArray(data.rows) || data.rows.length===0){ return; }
            const emptyHint = document.getElementById('emptyHint');
            if(emptyHint) emptyHint.style.display = 'none';
            applyRows(data.rows);
            sortState = { column:null, direction:'asc', deptColumn:null, deptDirection:'asc' };
            summaryStatusFilter = '';
            summaryDueFilter = '';
            renderAll();
            showLastCheck(data);
        }catch(e){ console.warn('[CDS] loadLastResult:', e); }
    }
    document.addEventListener('DOMContentLoaded', loadLastResult);
</script>

<script>
(function () {
    var root = document.documentElement;
    var MOSCOW_LAT = 55.7558, MOSCOW_LON = 37.6173, MOSCOW_TZ = 3;
    function isDaytimeInMoscow() {
        var now = new Date();
        var start = new Date(now.getFullYear(), 0, 0);
        var dayOfYear = Math.floor((now - start) / 86400000);
        var decl = 0.409 * Math.sin(2 * Math.PI * (dayOfYear - 80) / 365);
        var latRad = MOSCOW_LAT * Math.PI / 180;
        var cosH = (Math.sin(-0.83 * Math.PI / 180) - Math.sin(latRad) * Math.sin(decl)) / (Math.cos(latRad) * Math.cos(decl));
        var H = cosH >= 1 ? 0 : cosH <= -1 ? Math.PI : Math.acos(cosH);
        var sunriseLocal = ((12 - (H * 12 / Math.PI) - (MOSCOW_LON / 15)) + MOSCOW_TZ + 24) % 24;
        var sunsetLocal = ((12 + (H * 12 / Math.PI) - (MOSCOW_LON / 15)) + MOSCOW_TZ + 24) % 24;
        var currentHour = now.getHours() + now.getMinutes() / 60;
        return currentHour >= sunriseLocal && currentHour < sunsetLocal;
    }
    function applyTheme(themeMode) {
        var activeTheme = themeMode;
        if (themeMode === "auto-moscow") activeTheme = isDaytimeInMoscow() ? "light" : "dark";
        root.setAttribute("data-theme", activeTheme);
        root.dataset.theme = activeTheme;
        var toggle = document.getElementById("themeToggleBtn");
        if (!toggle) return;
        var icon = toggle.querySelector(".theme-toggle-icon");
        var text = toggle.querySelector(".theme-toggle-text");
        if (themeMode === "dark") { if (icon) icon.textContent = "\u{1F319}"; if (text) text.textContent = "Тёмная тема"; }
        else if (themeMode === "light") { if (icon) icon.textContent = "\u2600\uFE0F"; if (text) text.textContent = "Светлая тема"; }
        else if (themeMode === "kreml") { if (icon) icon.textContent = "\u{1F3DB}\uFE0F"; if (text) text.textContent = "Московская"; }
        else { if (icon) icon.textContent = isDaytimeInMoscow() ? "\u{1F6F0}\u2600\uFE0F" : "\u{1F6F0}\u{1F319}"; if (text) text.textContent = "Подмосковное солнце"; }
    }
    applyTheme(localStorage.getItem("neurona-theme-mode") || "auto-moscow");
    var toggle = document.getElementById("themeToggleBtn");
    if (toggle) {
        toggle.onclick = null;
        toggle.addEventListener("click", function () {
            var cur = localStorage.getItem("neurona-theme-mode") || "auto-moscow";
            var next = cur === "auto-moscow" ? "light" : cur === "light" ? "dark" : cur === "dark" ? "kreml" : "auto-moscow";
            localStorage.setItem("neurona-theme-mode", next);
            applyTheme(next);
        });
    }
    setInterval(function () {
        var cur = localStorage.getItem("neurona-theme-mode") || "auto-moscow";
        if (cur === "auto-moscow") applyTheme("auto-moscow");
    }, 60000);
})();
</script>

<script>
(function(){
    function make(){
        var host = document.querySelector(".top-actions") || document.querySelector(".topbar");
        if (!host) { setTimeout(make, 300); return; }
        if (document.getElementById("glassToggle")) return;
        var b = document.createElement("button");
        b.id = "glassToggle";
        b.type = "button";
        var anchor = host.querySelector(".theme-dropdown, .theme-toggle, .theme-toggle-btn");
        if (anchor) { anchor.parentNode.insertBefore(b, anchor); } else { host.appendChild(b); }
        function paint(){
            var on = document.documentElement.getAttribute("data-glass") === "on";
            var SVG_ON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c4.2 5.6 7 9.3 7 13a7 7 0 1 1-14 0c0-3.7 2.8-7.4 7-13z"/></svg>';
            var SVG_OFF = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3c3.7 5 6.3 8.4 6.3 11.8a6.3 6.3 0 1 1-12.6 0C5.7 11.4 8.3 8 12 3z"/></svg>';
            b.innerHTML = on ? SVG_ON : SVG_OFF;
            b.classList.toggle("on", on);
            b.title = on ? "Жидкое стекло: вкл" : "Жидкое стекло: выкл";
        }
        b.addEventListener("click", function(){
            var on = document.documentElement.getAttribute("data-glass") === "on";
            document.documentElement.setAttribute("data-glass", on ? "off" : "on");
            localStorage.setItem("neurona-glass", on ? "off" : "on");
            paint();
        });
        paint();
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", make);
    else make();
})();
</script>
