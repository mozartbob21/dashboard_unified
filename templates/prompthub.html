<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нейрона — ПромтХаб</title>
<style>
:root{--bg:#f2f4fb;--bg2:#e9ecf7;--card:#fff;--text:#0b1220;--muted:#6b7a90;
  --border:#e3e8f4;--acc1:#4f6df5;--acc2:#8b5cf6;--shadow:0 10px 34px rgba(23,37,84,.10)}
html[data-theme="dark"]{--bg:#0a0f1e;--bg2:#0d1426;--card:#121a30;--text:#e6ecf8;
  --muted:#8fa0ba;--border:#1d2a47;--shadow:0 10px 34px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0}
body{font-family:"Inter","Segoe UI",system-ui,sans-serif;color:var(--text);min-height:100vh;
  background:radial-gradient(1100px 480px at 88% -10%, rgba(139,92,246,.14), transparent 60%),
  radial-gradient(900px 420px at -10% 110%, rgba(79,109,245,.12), transparent 60%), var(--bg)}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:rgba(120,134,170,.35);border-radius:99px}
.top{display:flex;align-items:center;gap:14px;padding:14px 26px;position:sticky;top:0;z-index:5;
  background:color-mix(in srgb, var(--card) 82%, transparent);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border)}
.logo{width:46px;height:46px;border-radius:16px;flex:none;display:flex;align-items:center;
  justify-content:center;filter:drop-shadow(0 5px 14px rgba(79,109,245,.25))}
.logo img{width:100%;height:100%;border-radius:inherit}
.top h1{font-size:17px;font-weight:800}
.top .sub{font-size:11.5px;color:var(--muted)}
.top .nav{margin-left:auto;display:flex;gap:8px}
.top .nav a{text-decoration:none;color:var(--acc1);font-weight:700;font-size:13px;
  padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card)}
.top .nav a:hover{border-color:var(--acc1)}
.wrap{max-width:1120px;margin:0 auto;padding:26px 20px 60px;display:grid;
  grid-template-columns:380px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;
  box-shadow:var(--shadow);padding:20px;animation:fadeUp .3s both}
.card h2{font-size:15px;font-weight:800;margin-bottom:4px}
.card .p{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.5}
.card label{display:block;font-size:11px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px}
.card textarea,.card input{width:100%;border:1px solid var(--border);border-radius:12px;
  background:var(--bg2);color:var(--text);font:inherit;font-size:13px;padding:11px 12px;outline:none}
.card textarea{height:110px;resize:vertical}
.card textarea:focus,.card input:focus{border-color:var(--acc1)}
.save{margin-top:14px;width:100%;border:none;border-radius:12px;padding:12px;cursor:pointer;
  background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;font:inherit;
  font-weight:700;font-size:13.5px;box-shadow:0 8px 20px rgba(99,102,241,.35)}
.save:hover{filter:brightness(1.08)}
.listhead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.listhead h2{font-size:15px;font-weight:800}
.listhead span{font-size:12px;color:var(--muted)}
.plist{display:flex;flex-direction:column;gap:12px}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow);padding:16px 18px;animation:fadeUp .3s both}
.pcard .d{font-size:14px;font-weight:800}
.pcard .t{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.6;white-space:pre-wrap}
.pcard .f{display:flex;align-items:center;gap:10px;margin-top:12px;
  padding-top:10px;border-top:1px solid var(--border)}
.like{border:none;background:none;cursor:pointer;font-size:12.5px;color:var(--muted);
  display:flex;gap:6px;align-items:center;font-weight:700}
.like.on{color:#ef4444}
.like:hover{transform:scale(1.06)}
.pbtn{margin-left:auto;border:1px solid var(--border);background:var(--bg2);border-radius:10px;
  font-size:11.5px;padding:6px 12px;cursor:pointer;color:var(--acc1);font-weight:700}
.pbtn:hover{border-color:var(--acc1)}
.pbtn.main{background:linear-gradient(135deg,var(--acc1),var(--acc2));border:none;color:#fff}
.empty{text-align:center;color:var(--muted);padding:50px 0;font-size:13px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:13px;
  opacity:0;pointer-events:none;transition:.3s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="top">
  <div class="logo"><img src="{{ logo_url }}" alt="Нейрона"></div>
  <div><h1>Нейрона ПромтХаб</h1>
    <div class="sub">рабочие промты команды · делись, лайкай, используй</div></div>
  <div class="nav"><a href="/aichat">← AI-чат</a><a href="/">Главная</a></div>
</div>
<div class="wrap">
  <div class="card">
    <h2>💡 Поделиться промтом</h2>
    <div class="p">Опиши задачу и вставь проверенный промт — коллеги увидят его сразу и смогут поставить ❤️.</div>
    <label>Короткое описание</label>
    <input id="pDesc" placeholder="Например: Служебная записка по аварии">
    <label>Текст промта</label>
    <textarea id="pText" placeholder="Составь служебную записку о прорыве трубы по адресу …"></textarea>
    <button class="save" id="pSave">Сохранить в ПромтХаб</button>
  </div>
  <div>
    <div class="listhead"><h2>Промты команды</h2><span id="pCount"></span></div>
    <div class="plist" id="pList"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const api = (u,o) => fetch(u,o).then(r=>r.json());
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show");
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),3500); }
let liked = JSON.parse(localStorage.getItem("hubLiked")||"[]");

async function load(){
  const r = await api("/aichat/api/prompts");
  window._items = r.items||[];
  $("pCount").textContent = window._items.length ? ("· " + window._items.length) : "";
  $("pList").innerHTML = window._items.map(p => `
    <div class="pcard">
      <div class="d">${esc(p.desc)}</div>
      <div class="t">${esc(p.text)}</div>
      <div class="f">
        <button class="like ${liked.includes(p.id)?"on":""}" data-like="${p.id}">
          ${liked.includes(p.id)?"❤️":"🤍"} ${p.likes||0}</button>
        <button class="pbtn" data-copy="${p.id}">копировать</button>
        <button class="pbtn main" data-use="${p.id}">в чат →</button>
      </div>
    </div>`).join("")
    || '<div class="empty">Пока пусто — стань первым, кто поделится промтом! 💡</div>';
}
$("pSave").onclick = async () => {
  const text = $("pText").value.trim(), desc = $("pDesc").value.trim();
  if (!text){ toast("Вставь текст промта"); return; }
  await api("/aichat/api/prompts",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({text, desc})});
  $("pText").value=""; $("pDesc").value="";
  toast("💡 Промт опубликован"); load();
};
$("pList").addEventListener("click", async e => {
  const like = e.target.closest("[data-like]");
  if (like){ const id = like.dataset.like;
    if (liked.includes(id)) return;
    liked.push(id); localStorage.setItem("hubLiked", JSON.stringify(liked));
    await api("/aichat/api/prompts/"+id+"/like",{method:"POST"}); load(); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp){ const p = window._items.find(x=>x.id===cp.dataset.copy);
    navigator.clipboard.writeText(p.text); toast("Скопировано в буфер"); return; }
  const use = e.target.closest("[data-use]");
  if (use){ const p = window._items.find(x=>x.id===use.dataset.use);
    localStorage.setItem("hubPending", p.text); location.href = "/aichat"; }
});
load();
</script>
</body>
</html>
